# =============================================================================
# Nginx site for api.baagly.com
#
# Install on the Ubuntu server:
#   sudo cp deploy/nginx/api.baagly.com.conf /etc/nginx/sites-available/api.baagly.com
#   sudo ln -s /etc/nginx/sites-available/api.baagly.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot add the TLS block:
#   sudo certbot --nginx -d api.baagly.com
#
# Certbot rewrites this file to listen on 443 and redirect 80 → 443. Do not add
# the TLS directives by hand; certbot manages renewal against what it wrote.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.baagly.com;

    # Photos can be large, and the listing wizard allows up to 8 per property.
    # Nginx defaults to 1 MB, which rejects an ordinary phone photo with a
    # confusing 413 before the request ever reaches the API.
    client_max_body_size 25M;

    # Uploads are served straight from the API's static handler; give slow
    # mobile connections room rather than cutting them off mid-transfer.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # The API sets `trust proxy` to one hop and reads the client address
        # from these. Without them every request looks like it came from
        # 127.0.0.1 and rate limiting becomes one shared bucket.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Needed if websockets are ever added; harmless until then.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Let the API decide what is cacheable. Razorpay webhooks and auth
        # responses must never be served from a proxy cache.
        proxy_buffering off;
    }

    # Uncached health endpoint for uptime monitoring.
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}
